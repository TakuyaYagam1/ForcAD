[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forcad"
version = "0.0.0"
description = "ForcAD application and operator tools"
requires-python = ">=3.14,<3.15"
dependencies = [
    "celery>=5.3.4,<6",
    "Flask>=3.1,<4",
    "Flask-Cors>=6,<7",
    "Flask-SocketIO>=5.5,<6",
    "flower>=2,<3",
    "gunicorn>=23",
    "hiredis>=3",
    "kombu>=5.5,<6",
    "prometheus-client>=0.20",
    "prometheus-flask-exporter>=0.23",
    "psycopg2>=2.9.10,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-dateutil>=2.9,<3",
    "python-socketio>=5.16.4,<6",
    "pytz",
    "PyYAML>=6.0.2,<7",
    "redis>=5",
    "requests>=2.32",
]

[project.scripts]
forcad = "forcad.cli:main"

[dependency-groups]
cli = ["click==8.5.0"]
test = [
    "fakeredis[lua]==2.39.0",
    "python-dotenv==1.2.4",
]
lint = [
    "flake8==7.4.1",
    "ruff==0.16.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"forcad.scripts" = ["*.sql"]

[tool.forcad.tools]
sqlfluff = "sqlfluff==4.4.0"
