version: "2"
sql:
  - engine: postgresql
    schema: ../db/migrations
    queries: ../db/queries
    gen:
      go:
        package: sqlc
        out: ../internal/adapter/secondary/postgres/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type:
              import: uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: uuid
              type: UUID
              pointer: true
