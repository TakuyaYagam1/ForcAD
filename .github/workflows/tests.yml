name: tests
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      run_docker_cleanup:
        description: Run the isolated Docker cleanup integration test
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        test_type:
          - BLITZ
          - CLASSIC

    runs-on: "ubuntu-22.04"
    timeout-minutes: 15
    env:
      TEST: 1
      FORCAD_ALLOW_DESTRUCTIVE_TESTS: "1"
      TEST_TYPE: ${{ matrix.test_type }}
      PYTHONUNBUFFERED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
          cache: "pip"
          cache-dependency-path: backend/uv.lock

      - name: Install locked project
        run: |
          python -m pip install uv==0.13.0
          uv sync --project backend --locked --all-groups
          echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"

      - name: Setup tests
        run: python backend/tests/setup_forcad.py

      - name: Setup ForcAD
        run: ./control.py setup

      - name: Build ForcAD
        run: ./control.py build

      - name: Start & run tests
        run: |
          ./control.py start
          docker ps
          ./control.py rd ps
          ./control.py rd logs -f initializer
          python backend/tests/wait_for_start.py
          ./control.py rd ps
          python scripts/run_game_tests.py

      - name: Show logs
        if: ${{ failure() }}
        run: ./control.py rd logs --tail 2000

  backend_linter:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"

      - name: Install lint dependencies
        run: |
          python -m pip install uv==0.13.0
          uv sync --project backend --locked --all-groups
          echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"

      - name: Run linters
        run: make lint-backend lint-sql

  frontend_linter:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.11.2"
          run_install: false

      - name: Set up Node 26.8.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.8.2"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Smoke test the Vite development server
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$RUNNER_TEMP/forcad-vite.log"
          pnpm run dev --host 127.0.0.1 --port 5173 --strictPort >"$log" 2>&1 &
          server_pid=$!
          trap '
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          ' EXIT
          for ((attempt = 1; attempt <= 30; attempt++)); do
            if curl --fail --silent http://127.0.0.1:5173/ -o /dev/null; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
            sleep 1
          done
          cat "$log"
          echo "Vite did not become ready on port 5173." >&2
          exit 1

      - name: Run frontend tests
        working-directory: frontend
        run: pnpm run test

      - name: Run linters
        working-directory: frontend
        run: pnpm run lint

      - name: Check the frontend compiles
        working-directory: frontend
        run: pnpm run build

  nginx_image:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build nginx image and check generic logo and theme handling
        run: scripts/test_nginx_image.sh

  dispatch_integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14.8
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install locked project
        run: |
          python -m pip install uv==0.13.0
          uv sync --project backend --locked --all-groups
          echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"

      - name: Prepare isolated PostgreSQL socket directory
        run: install -d -m 0777 "$RUNNER_TEMP/forcad-postgres"

      - name: Start isolated PostgreSQL 18.6 with Unix socket only
        run: |
          docker run --detach --rm \
            --name forcad-test-dispatch-postgres \
            --network none \
            --mount "type=bind,src=$RUNNER_TEMP/forcad-postgres,dst=/var/run/postgresql" \
            --env POSTGRES_DB=postgres \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --health-cmd 'pg_isready -h /var/run/postgresql -U postgres -d postgres' \
            --health-interval 2s \
            --health-timeout 3s \
            --health-retries 30 \
            postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873 \
            -c listen_addresses= \
            -c unix_socket_directories=/var/run/postgresql

      - name: Wait for PostgreSQL initialization
        run: |
          for ((attempt = 1; attempt <= 40; attempt++)); do
            state="$(docker inspect --format '{{.State.Health.Status}}' forcad-test-dispatch-postgres)"
            if [ "$state" = healthy ]; then
              exit 0
            fi
            if [ "$state" = unhealthy ]; then
              docker logs forcad-test-dispatch-postgres
              exit 1
            fi
            sleep 2
          done
          docker logs forcad-test-dispatch-postgres
          echo "PostgreSQL did not become healthy in time." >&2
          exit 1

      - name: Create the disposable test database
        run: docker exec forcad-test-dispatch-postgres createdb -h /var/run/postgresql -U postgres forcad_test_dispatch

      - name: Run dispatch integration tests over the Unix socket
        env:
          FORCAD_POSTGRES_TESTS: "1"
          FORCAD_TEST_DSN: host=${{ runner.temp }}/forcad-postgres dbname=forcad_test_dispatch user=postgres
        run: python -m unittest discover -v -s backend/tests -p 'test_dispatch_integration.py'

      - name: Stop isolated PostgreSQL
        if: ${{ always() }}
        run: docker rm --force forcad-test-dispatch-postgres || true

  docker_cleanup:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_docker_cleanup }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14.8
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"

      - name: Check fixture images
        run: |
          if rg -n 'postgres:13\.4-alpine|redis:6\.2\.5-alpine|rabbitmq:3\.9\.7-management-alpine' backend/tests/test_cleanup_integration.py; then
            echo "Update the isolated cleanup fixture to supported image tags before running it." >&2
            exit 1
          fi

      - name: Pull isolated storage images
        run: |
          docker pull postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          docker pull redis:8.4.7-alpine@sha256:0514fa59e3d84e2f3be66731c5401fc2a85b8ea71b49c0116c850f6a558076f4

      - name: Check PostgreSQL data preparation and legacy cluster protection
        run: |
          docker build --file deployment/docker/postgres/Dockerfile --tag forcad-postgres:test .
          deployment/docker/scripts/test_postgres_image.sh forcad-postgres:test

      - name: Install locked project
        run: |
          python -m pip install uv==0.13.0
          uv sync --project backend --locked --all-groups
          echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"

      - name: Run isolated Docker cleanup test
        env:
          FORCAD_DOCKER_TESTS: "1"
        run: python -m unittest discover -v -s backend/tests -p 'test_cleanup_integration.py'
