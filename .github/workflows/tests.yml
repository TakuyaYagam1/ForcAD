name: tests
on:
  push:
    branches: [main, master, modernization]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.11.2"
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.8.2"
          cache: "pnpm"
          cache-dependency-path: api/pnpm-lock.yaml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Install and test contract tooling
        run: |
          make sync-codegen
          pnpm --dir ../api test
      - name: Verify dependency checksums
        run: go mod download && go mod verify
      - name: Check generated Go code
        run: |
          make generate
          test ! -e ../api/openapi.yml
          test ! -e ../api/components/schemas.yml
          git diff --exit-code -- internal/adapter/primary/http/api internal/adapter/secondary/postgres/sqlc internal/bootstrap/wire_gen.go
          test -z "$(git ls-files --others --exclude-standard internal/adapter/primary/http/api internal/adapter/secondary/postgres/sqlc internal/bootstrap/wire_gen.go)"
      - name: Install backend linters
        run: make install-tools
      - name: Lint Go and SQL
        run: make -k lint
      - name: Run tests with race detection
        run: go test -race -count=1 ./cmd/... ./config/... ./db/... ./internal/... ./load_test
      - name: Check load fixture isolation
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s load_test/test-data/services -v
      - name: Test reference Python checkers through the Go runner
        run: make test-checker
      - name: Build application
        run: make build
      - name: Test operator launcher
        run: |
          go test -race -count=1 ./integration_test/operator
          ../control.sh --help
          ../control.sh validate --config config/config.yml.example

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Test PostgreSQL, Redis, RabbitMQ and checker workflows
        run: backend/integration_test/scripts/run_tests.sh

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.11.2"
          run_install: false

      - name: Set up Node 26.8.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.8.2"
          cache: "pnpm"
          cache-dependency-path: |
            api/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Set up Python for schema merging
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"

      - name: Install contract tooling
        run: make -C frontend sync-codegen

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Smoke test the Vite development server
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$RUNNER_TEMP/forcad-vite.log"
          pnpm run dev --host 127.0.0.1 --port 5173 --strictPort >"$log" 2>&1 &
          server_pid=$!
          trap '
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          ' EXIT
          for ((attempt = 1; attempt <= 30; attempt++)); do
            if curl --fail --silent http://127.0.0.1:5173/ -o /dev/null; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
            sleep 1
          done
          cat "$log"
          echo "Vite did not become ready on port 5173." >&2
          exit 1

      - name: Verify generated API client
        working-directory: frontend
        run: |
          pnpm generate:api
          test ! -e ../api/openapi.yml
          test ! -e ../api/components/schemas.yml
          git diff --exit-code -- src/shared/api/generated
          test -z "$(git ls-files --others --exclude-standard src/shared/api/generated)"

      - name: Run frontend tests
        working-directory: frontend
        run: pnpm run test

      - name: Run linters
        working-directory: frontend
        run: |
          pnpm run lint
          pnpm typecheck:e2e

      - name: Check the frontend compiles
        working-directory: frontend
        run: pnpm run build

  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.11.2"
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.8.2"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install browser test runner
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Test production images through the browser and API
        env:
          TMPDIR: ${{ runner.temp }}
        run: make -C deployment e2e

      - name: Test monitoring and router exporter
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          make -C deployment test-monitoring
          make -C deployment test-network

  nginx_image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build nginx image and check generic logo and theme handling
        run: scripts/test_nginx_image.sh
