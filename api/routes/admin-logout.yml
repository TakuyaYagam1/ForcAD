post:
  operationId: adminLogout
  tags:
  - admin
  summary: End the current administrator session.
  description: Clears the session cookie if one is present.
  security: []
  responses:
    '200':
      description: Session ended.
      headers:
        Set-Cookie:
          description: Expired session cookie.
          schema:
            type: string
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yml#/StatusResponse"
