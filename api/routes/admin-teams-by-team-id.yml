parameters:
- "$ref": "../components/parameters.yml#/TeamId"
get:
  operationId: getAdminTeam
  tags:
  - admin
  summary: Get one team, including administration fields.
  security:
  - sessionCookie: []
  responses:
    '200':
      description: The requested team.
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yml#/AdminTeam"
    '403':
      "$ref": "../components/responses.yml#/ApiError"
    '404':
      "$ref": "../components/responses.yml#/ApiError"
put:
  operationId: updateAdminTeam
  tags:
  - admin
  summary: Replace a team's editable fields.
  security:
  - sessionCookie: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          "$ref": "../components/schemas.yml#/AdminTeamUpdate"
  responses:
    '200':
      description: The updated team.
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yml#/AdminTeam"
    '400':
      "$ref": "../components/responses.yml#/ApiError"
    '403':
      "$ref": "../components/responses.yml#/ApiError"
    '404':
      "$ref": "../components/responses.yml#/ApiError"
    '409':
      "$ref": "../components/responses.yml#/ApiError"
delete:
  operationId: deleteAdminTeam
  tags:
  - admin
  summary: Deactivate a team.
  security:
  - sessionCookie: []
  responses:
    '200':
      description: The team was deactivated.
      content:
        application/json:
          schema:
            type: string
            enum:
            - ok
    '403':
      "$ref": "../components/responses.yml#/ApiError"
    '404':
      "$ref": "../components/responses.yml#/ApiError"
