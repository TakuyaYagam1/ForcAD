put:
  operationId: submitFlags
  tags:
  - flag-receiver
  summary: Submit flags for checking.
  description: Both /flags and /flags/ are accepted by the backend.
  security:
  - teamToken: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 32
  responses:
    '200':
      description: One result for each submitted flag, in request order.
      content:
        application/json:
          schema:
            type: array
            items:
              "$ref": "../components/schemas.yml#/FlagSubmissionResult"
    '400':
      "$ref": "../components/responses.yml#/ApiError"
    '410':
      "$ref": "../components/responses.yml#/ApiError"
    '413':
      "$ref": "../components/responses.yml#/ApiError"
    '415':
      "$ref": "../components/responses.yml#/ApiError"
    '429':
      "$ref": "../components/responses.yml#/ApiError"
    '503':
      "$ref": "../components/responses.yml#/ApiError"
