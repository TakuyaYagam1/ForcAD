get:
  operationId: getAdminSessionStatus
  tags:
  - admin
  summary: Check the current administrator session.
  description: Returns the session-bound CSRF token for administrative mutations. Responses are Cache-Control no-store.
  security:
  - sessionCookie: []
  responses:
    '200':
      description: Session is active.
      content:
        application/json:
          schema:
            "$ref": "../components/schemas.yml#/AdminSession"
    '403':
      "$ref": "../components/responses.yml#/ApiError"
