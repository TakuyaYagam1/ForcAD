# Proposed values for dedicated final hosts. Review and apply on the host;
# the bundle installers do not manage these additional keys.
# Load nf_conntrack before applying this file. Record old values for rollback.
net.core.somaxconn = 16384
net.core.netdev_max_backlog = 32768
net.ipv4.tcp_max_syn_backlog = 16384
net.ipv4.ip_local_port_range = 10000 65535
net.netfilter.nf_conntrack_max = 4194304
