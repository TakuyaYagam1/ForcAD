x-service: &default-ms
  build:
    context: .
    dockerfile: ./docker_config/services/Dockerfile
  env_file: &db-environment
    - ./docker_config/postgres_environment.env
    - ./docker_config/redis_environment.env
    - ./docker_config/rabbitmq_environment.env
  restart: on-failure
  mem_limit: "${FORCAD_SERVICE_MEMORY:-512m}"
  pids_limit: ${FORCAD_SERVICE_PIDS:-512}
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-celery-service: &default-celery-ms
  build:
    context: .
    dockerfile: ./docker_config/celery/Dockerfile
  volumes:
    - ./checkers/:/checkers/
  env_file: *db-environment
  restart: on-failure
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  celery:
    <<: *default-celery-ms
    mem_limit: "${FORCAD_WORKER_MEMORY:-0}"
    mem_reservation: "${FORCAD_WORKER_MEMORY_RESERVATION:-8g}"
    pids_limit: ${FORCAD_WORKER_PIDS:-256}
    environment:
      TEST: "${TEST:-}"
      SERVICE: worker
      FORCAD_CHECKER_MEMORY_LIMIT_MB: "${FORCAD_CHECKER_MEMORY_LIMIT_MB:-1024}"
      FORCAD_CHECKER_OUTPUT_LIMIT_BYTES: "${FORCAD_CHECKER_OUTPUT_LIMIT_BYTES:-1048576}"
      # Celery expects the maximum first, then the minimum.
      FORCAD_WORKER_AUTOSCALE: "${FORCAD_WORKER_AUTOSCALE:-32,16}"

  flower:
    <<: *default-celery-ms
    mem_limit: "${FORCAD_SERVICE_MEMORY:-512m}"
    pids_limit: ${FORCAD_SERVICE_PIDS:-512}
    environment:
      - TEST
      - SERVICE=flower
    env_file:
      - ./docker_config/services/admin.env
      - ./docker_config/postgres_environment.env
      - ./docker_config/redis_environment.env
      - ./docker_config/rabbitmq_environment.env

  initializer:
    build:
      context: .
      dockerfile: ./docker_config/initializer/Dockerfile
    env_file: *db-environment
    volumes:
      - forcad-config:/run/forcad-config:ro
    environment:
      - TEST
      - CONFIG_PATH=/run/forcad-config/config.yml
    restart: on-failure
    depends_on:
      config-loader:
        condition: service_completed_successfully
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # One-shot bridge from the host's private config file to the nonroot initializer.
  config-loader:
    build:
      context: .
      dockerfile: ./docker_config/initializer/Dockerfile
    user: "0:0"
    entrypoint: ["/stage_config.sh"]
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config.yml:/source/config.yml:ro
      - forcad-config:/run/forcad-config
    restart: "no"

  ticker:
    <<: *default-ms
    environment:
      TEST: "${TEST:-}"
      SERVICE: ticker

  client-api:
    <<: *default-ms
    environment:
      TEST: "${TEST:-}"
      SERVICE: api
      FORCAD_HTTP_THREADS: "${FORCAD_HTTP_THREADS:-100}"

  admin-api:
    <<: *default-ms
    environment:
      TEST: "${TEST:-}"
      SERVICE: admin
      FORCAD_HTTP_THREADS: "${FORCAD_HTTP_THREADS:-100}"
    env_file:
      - ./docker_config/services/admin.env
      - ./docker_config/postgres_environment.env
      - ./docker_config/redis_environment.env
      - ./docker_config/rabbitmq_environment.env

  events:
    <<: *default-ms
    # Threaded WebSockets also allocate reader, writer and heartbeat threads.
    pids_limit: ${FORCAD_EVENTS_PIDS:-2048}
    environment:
      TEST: "${TEST:-}"
      SERVICE: events
      FORCAD_HTTP_THREADS: "${FORCAD_EVENTS_THREADS:-${FORCAD_HTTP_THREADS:-300}}"

  http-receiver:
    <<: *default-ms
    environment:
      TEST: "${TEST:-}"
      SERVICE: http_receiver
      FORCAD_HTTP_THREADS: "${FORCAD_HTTP_THREADS:-100}"

  nginx:
    build:
      context: .
      dockerfile: ./docker_config/nginx/Dockerfile
      args:
        DNS_RESOLVER: 127.0.0.11
    ports:
      - "${FORCAD_NGINX_BIND:-0.0.0.0}:8080:8080"
      - "${FORCAD_NGINX_BIND:-0.0.0.0}:80:8080"
    environment:
      PUBLIC_SCHEME: "${PUBLIC_SCHEME:-http}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
    restart: on-failure
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - flower
      - client-api
      - admin-api
      - events
      - http-receiver

  redis:
    image: redis:8.2.10-alpine
    command: [ "sh", "-c", "redis-server --requirepass $$REDIS_PASSWORD" ]
    restart: on-failure
    sysctls:
      net.core.somaxconn: 1024
    env_file:
      - ./docker_config/redis_environment.env
    ports:
      - "127.0.0.1:6379:6379"

  rabbitmq:
    hostname: rabbitmq
    image: rabbitmq:4.3.6-management-alpine
    restart: on-failure
    env_file:
      - ./docker_config/rabbitmq_environment.env
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  postgres:
    image: forcad_postgres:local
    build:
      context: .
      dockerfile: ./docker_config/postgres/Dockerfile
    volumes:
      - ./docker_volumes/postgres/data/:/var/lib/postgresql/data/
    env_file:
      - ./docker_config/postgres_environment.env
    restart: on-failure
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres-data:
        condition: service_completed_successfully
    command: "postgres --max-connections=200"
    ports:
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:6432:5432"

  postgres-data:
    image: forcad_postgres:local
    build:
      context: .
      dockerfile: ./docker_config/postgres/Dockerfile
    user: "0:0"
    entrypoint: ["/usr/local/bin/prepare-data"]
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./docker_volumes/postgres/data/:/var/lib/postgresql/data/
    restart: "no"

volumes:
  forcad-config:
